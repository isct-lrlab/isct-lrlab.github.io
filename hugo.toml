baseURL = "https://example.org/"
title = "東京科学大学 LRLab / 奥村・船越研究室"
defaultContentLanguage = "ja"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
publishDir = "docs"
hasCJKLanguage = true
summaryLength = 90

[params]
  recentNewsLimit = 10
  address = "〒226-8501 神奈川県横浜市緑区長津田町4259 東京科学大学総合研究院未来産業技術研究所 R2棟"
  address_en = "Bldg. R2, FIRST, IIR, Institute of Science Tokyo, Nagatsuta 4259, Midori-ku, Yokohama, Kanagawa 226-8501, Japan"
  description = "自然言語処理、対話システム、知識処理に取り組む研究室です。"
  description_en = "A research group working on natural language processing, dialogue systems, and knowledge processing."
  publicationsBodyFontSize = "1.1rem"

[languages]
  [languages.ja]
    label = "日本語"
    locale = "ja-JP"
    title = "東京科学大学 LRLab / 奥村・船越研究室"
    weight = 1
  [languages.en]
    label = "English"
    locale = "en-US"
    title = "Science Tokyo LRLab / Okumura-Funakoshi Group"
    weight = 2

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

